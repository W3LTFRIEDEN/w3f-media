name: Check manifest

# Fails when manifest.json breaks its schema or names a file that no published release carries.
# The site skips such a file rather than breaking, so this is where the mistake becomes visible.
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Schema
        run: npx --yes ajv-cli@5 validate --spec=draft2020 -s manifest.schema.json -d manifest.json
      - name: Every listed file is on a published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases" --paginate \
            --jq '.[] | select(.draft | not) | .assets[].name' | sort -u > published.txt
          jq -r '.sections[][].files[].name' manifest.json | sort -u > listed.txt
          missing=$(comm -23 listed.txt published.txt)
          if [ -n "$missing" ]; then
            echo "::error::Listed in manifest.json but on no published release:"
            echo "$missing"
            exit 1
          fi
